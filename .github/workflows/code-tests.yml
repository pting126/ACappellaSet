name: Code tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU inference environment
        run: |
          python -m pip install torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-linux-cpu-lock.txt
      - name: Test portable tools and canonical scoring
        run: |
          python -m unittest discover -s tests -p test_release_tools.py -v
          python -m unittest discover -s tests -p test_evaluate.py -v
          python -m unittest discover -s tests -p test_conditioned.py -v
          python -m unittest discover -s tests -p test_conditioned_runtime.py -v
          python -m unittest discover -s tests -p test_data_protocol.py -v
          python -m unittest discover -s tests -p test_training.py -v
